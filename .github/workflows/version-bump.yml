name: Auto version bump on PR merge

# Bumps package.json (the source of truth shown in the masthead via RawMaquette)
# when a PR is merged to main and carries one of these labels:
#   - semver:patch  → 2.0.0-beta.0 → 2.0.0-beta.1 (during beta) / 2.0.1 (post-beta)
#   - semver:minor  → 2.0.0-beta.0 → 2.1.0-beta.0 (during beta) / 2.1.0 (post-beta)
#   - semver:major  → 2.0.0-beta.0 → 3.0.0-beta.0 (during beta) / 3.0.0 (post-beta)
# PRs without a semver label do nothing (data refresh commits never come through
# a PR, so they are not affected).
#
# To graduate out of beta: hand-edit package.json on a normal PR
# (e.g. "2.0.0-beta.5" → "2.0.0") with a semver:patch label or no label.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  bump:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Determine bump type from PR labels
        id: bump
        env:
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          if echo "$LABELS" | grep -q '"semver:major"'; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"semver:minor"'; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q '"semver:patch"'; then
            echo "type=patch" >> "$GITHUB_OUTPUT"
          else
            echo "type=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip if no semver label
        if: steps.bump.outputs.type == 'none'
        run: echo "No semver:* label on PR — nothing to bump."

      - uses: actions/checkout@v6
        if: steps.bump.outputs.type != 'none'
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        if: steps.bump.outputs.type != 'none'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Bump version (prerelease-aware)
        if: steps.bump.outputs.type != 'none'
        id: ver
        env:
          TYPE: ${{ steps.bump.outputs.type }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          CURRENT=$(node -p "require('./package.json').version")
          if [[ "$CURRENT" == *-beta* ]]; then
            case "$TYPE" in
              patch) NPM_CMD="prerelease --preid=beta" ;;
              minor) NPM_CMD="preminor --preid=beta" ;;
              major) NPM_CMD="premajor --preid=beta" ;;
            esac
          else
            NPM_CMD="$TYPE"
          fi
          NEW=$(npm version $NPM_CMD --no-git-tag-version)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          git add package.json package-lock.json 2>/dev/null || git add package.json
          git commit -m "chore: bump version to $NEW (PR #$PR_NUMBER)"
          git push origin main

      - name: Trigger Pages deploy with new version
        if: steps.bump.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main
